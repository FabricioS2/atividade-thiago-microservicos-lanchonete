version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  cardapio:
    build: ./cardapio_service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/cardapio.db
    volumes:
      - cardapio_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pedidos:
    build: ./pedidos_service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/pedidos.db
      - CARDAPIO_SERVICE_URL=http://cardapio:8000
      - PAGAMENTO_SERVICE_URL=http://pagamento:8000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    volumes:
      - pedidos_data:/app/data
    depends_on:
      - cardapio
      - pagamento
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]

  pagamento:
    build: ./pagamento_service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/pagamento.db
    volumes:
      - pagamento_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]

  notificacao:
    build: ./notificacao_service
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/notificacao.db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    volumes:
      - notificacao_data:/app/data
    depends_on:
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]

volumes:
  cardapio_data:
  pedidos_data:
  pagamento_data:
  notificacao_data: